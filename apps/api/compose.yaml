# Local Postgres with pgvector, for running the Postgres tests or developing
# without Supabase:
#   docker compose up -d db
#   TEST_DATABASE_URL=postgresql://postgres@localhost:5432/postgres uv run pytest
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      # Local throwaway database: no password, only reachable from this machine.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
